<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | Sistema Hotel</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f5f7;
      font-family: system-ui, sans-serif;
      color: #1f2937;
    }
    form {
      width: min(360px, calc(100vw - 32px));
      padding: 32px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgb(0 0 0 / 8%);
      display: grid;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 1.4rem; }
    label { display: grid; gap: 6px; font-size: .9rem; }
    input {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #1d4ed8;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    a { color: #1d4ed8; font-size: .9rem; text-align: center; }
    .error { margin: 0; color: #b91c1c; font-size: .9rem; }
    .hint { margin: 0; color: #6b7280; font-size: .8rem; }
  </style>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    <h1>Sistema Hotel</h1>
    {% block form %}{% endblock %}
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</body>
</html>
